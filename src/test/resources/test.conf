# Configuration used by unit tests. Contains no real credentials or server addresses.
fluxer {
  instance_url="https://fluxer.example.invalid"
  token="1500000000000000000.FAKE-TEST-SECRET-not-a-real-token"
}

wow {
  version=1.12.1
  realmlist=realm.invalid
  realm=Test Realm
  account=test-account
  password=test-password
  character=Testchar
}

guild {
  promoted {
    enabled=1
    format="[%user] has promoted [%target] to [%rank]."
    channel=guild-events
  }
  online {
    enabled=0
    format="[%user] has come online."
    channel=guild-events
  }
  achievement {
    enabled=1
    format="%user has earned the achievement %achievement!"
  }
}

chat {
  enable_dot_commands=1
  dot_commands_whitelist=[
    "server info"
    "lookup *"
  ]
  enable_tag_failed_notifications=1
  item_database=""

  channels=[
    {
      direction=both
      wow {
        type=Guild
        format="[%user]: %message"
      }
      fluxer {
        channel=Guild-Chat
        format="[%user]: %message"
      }
    }
    {
      direction=both
      wow {
        type=Officer
        format="(%user) %message"
      }
      fluxer {
        channel="200"
        format="<%user> %message"
      }
    }
    {
      direction=wow_to_fluxer
      wow {
        type=Channel
        channel="Trade - City"
      }
      fluxer {
        channel=trade-chat
        format="[%target] [%user]: %message"
        filters {
          enabled=1
          patterns=[".*WTS.*"]
        }
      }
    }
    {
      direction=fluxer_to_wow
      wow {
        type=Say
        format="%message"
      }
      fluxer {
        channel=announcements
        format="%message"
      }
    }
  ]
}

filters {
  enabled=1
  patterns=[".*badword.*"]
}
