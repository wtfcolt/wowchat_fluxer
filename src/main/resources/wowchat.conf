# guild notifications
guild {
  online {
    enabled=0
    format="`[%user] has come online.`"
  }
  offline {
    enabled=0
    format="`[%user] has gone offline.`"
  }
  promoted {
    enabled=1
    format="`[%user] has promoted [%target] to [%rank].`"
  }
  demoted {
    enabled=1
    format="`[%user] has demoted [%target] to [%rank].`"
  }
  joined {
    enabled=1
    format="`[%user] has joined the guild.`"
  }
  left {
    enabled=1
    format="`[%user] has left the guild.`"
  }
  removed {
    enabled=1
    format="`[%target] has been kicked out of the guild by [%user].`"
  }
  motd {
    enabled=1
    format="`Guild Message of the Day: %message`"
  }
  achievement {
    enabled=1
    format="%user has earned the achievement %achievement!"
  }
}

# Shared chat settings and the channels to relay between WoW and Fluxer
chat {
  enable_dot_commands=1

  # List of server (dot) commands that are explicitly enabled
  # Leaving this as empty means ALL commands are enabled/disabled based on "enable_dot_commands" setting.
  # The commands here should reflect exactly how the command is input in game. Do not prepend the dot character.
  # We can also accept wildcards like "lookup *" or "pinfo *"
  dot_commands_whitelist=[
    #"server info"
    #"lookup *"
  ]

  # List of Fluxer channel names where commands (?who, ?online, ?gmotd) are enabled. If this is unspecified or empty,
  # ALL channels will have command permissions.
  enable_commands_channels=[

  ]

  # If a tag matching fails when someone in WoW @ a non-existent or unmatched person or role,
  # the bot will whisper back notifying so.
  enable_tag_failed_notifications=1

  # Database to use when sending messages to Fluxer when items are linked in chat
  # Defaults if not set:
  #  Vanilla   - http://classicdb.ch
  #  TBC       - http://tbc-twinhead.twinstar.cz
  #  WotLK     - http://wotlk-twinhead.twinstar.cz
  #  Cataclysm - http://cata-twinhead.twinstar.cz
  #  MoP       - http://mop-shoot.tauri.hu
  item_database=""

  # Channel relays. direction is one of: both, wow_to_fluxer, fluxer_to_wow
  # fluxer.channel is the Fluxer channel name or ID. Using the ID is recommended so renaming the channel does not break the relay.
  channels=[
    {
      direction=both
      wow {
        type=Guild
        format="[%user]: %message"
      }
      fluxer {
        channel=guild-chat
        format="[%user]: %message"
      }
    }
    {
      direction=both
      wow {
        type=Officer
        format="[%user]: %message"
      }
      fluxer {
        channel=officer-chat
        format="[%user]: %message"
      }
    }
    {
      direction=wow_to_fluxer
      wow {
        type=Say
        format="[%user]: %message"
      }
      fluxer {
        channel=guild-chat
        format="[%user]: %message"
      }
    }
    {
      direction=wow_to_fluxer
      wow {
        type=Yell
        format="[%user]: %message"
      }
      fluxer {
        channel=guild-chat
        format="[%user]: %message"
      }
    }
    {
      direction=wow_to_fluxer
      wow {
        type=Emote
        format="%user %message"
      }
      fluxer {
        channel=guild-chat
        format="%user %message"
      }
    }
    {
      direction=wow_to_fluxer
      wow {
        type=System
      }
      fluxer {
        channel=guild-chat
        format="[SYSTEM]: %message"
      }
    }

    # Custom channels
    {
      direction=wow_to_fluxer
      wow {
        type=Channel
        channel="General - Orgrimmar"
        format="[%user]: %message"
      }
      fluxer {
        channel=guild-chat
        format="[%target] [%user]: %message"
      }
    }
    {
      direction=wow_to_fluxer
      wow {
        type=Channel
        channel="Trade - City"
        format="[%user]: %message"
      }
      fluxer {
        channel=trade-chat
        format="[%target] [%user]: %message"
      }
    }

    # Class channels
    {
      direction=both
      wow {
        type=Channel
        channel=Cast
        format="[%user]: %message"
      }
      fluxer {
        channel=mages
        format="[%user]: %message"
      }
    }
    {
      direction=both
      wow {
        type=Channel
        channel=Chadwarriors
        format="[%user]: %message"
      }
      fluxer {
        channel=warriors
        format="[%user]: %message"
      }
    }
  ]
}

filters {
  enabled=0
  # patterns are Java Regexes. Google has the answers you seek.
  patterns=[
    ".*(?i)(?=.*g.?ld)(?=.*level)(?=.*item).*$" # case insensitive filter for messages containing all 3 words g?ld, level, and item in any order
    ".*(?=.*>>)(?=.*<<).*$" # filter for messages containg >> and << in any order (both must be in the message)
  ]
}
